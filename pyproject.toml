[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "dialogue-locator"
version = "0.1.0"
description = "Find the exact video frame where a spoken line begins (v2 architecture)"
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.0.0",
    "whisperx>=3.1.1",
    "torch>=2.2.0",
    "torchaudio>=2.2.0",
    "silero-vad>=5.1",
    "soundfile>=0.12.1",
    "rapidfuzz>=3.6.0",
    "yt-dlp>=2024.1.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=4.1.0"]

[project.scripts]
dialogue-locator = "cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
